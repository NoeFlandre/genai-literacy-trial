name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run mkdocs build --strict --site-dir /tmp/genai-literacy-trial-site
      - run: uv run python -m coverage run --source=src,scripts -m pytest
      - run: uv run python -m coverage json -o /tmp/genai-literacy-trial-coverage.json
      - run: uv run radon cc src scripts -j > /tmp/genai-literacy-trial-cc.json
      - run: uv run python scripts/check_crap.py --coverage-json /tmp/genai-literacy-trial-coverage.json --radon-json /tmp/genai-literacy-trial-cc.json
      - run: uv run python scripts/reproduce_small.py
      - run: uv run python scripts/validate_artifacts.py --mode small --public-output-dir repro_outputs/small/public
      - run: uv run genai-literacy-trial audit-privacy --root repro_outputs/small/public
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run genai-literacy-trial audit-privacy
