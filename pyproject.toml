[project]
name = "genai-literacy-trial"
version = "0.1.0"
description = "Privacy-preserving reproducibility package for the GenAI literacy prompt-engineering trial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Noe Y. Flandre" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1.5",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "typer>=0.12",
]

[project.scripts]
genai-literacy-trial = "genai_literacy_trial.cli:app"
genai-literacy-reproduce-small = "genai_literacy_trial.reproduce_small:main"
genai-literacy-validate-artifacts = "genai_literacy_trial.validate_artifacts:main"
genai-literacy-check-repo-hygiene = "genai_literacy_trial.repo_hygiene:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.15.15",
  "ty>=0.0.72",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
