[project]
name = "genai-literacy-trial"
version = "0.1.0"
description = "Privacy-preserving reproducibility package for the GenAI literacy prompt-engineering trial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Noe Y. Flandre" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1.5",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "typer>=0.12",
]

[project.scripts]
genai-literacy-trial = "genai_literacy_trial.cli:app"
genai-literacy-reproduce-small = "genai_literacy_trial.reproduce_small:main"
genai-literacy-validate-artifacts = "genai_literacy_trial.validate_artifacts:main"
genai-literacy-check-repo-hygiene = "genai_literacy_trial.repo_hygiene:main"

[dependency-groups]
dev = [
  "coverage>=7.6",
  "mkdocs-material>=9.6",
  "mutmut>=3.7.0",
  "pytest>=8.2",
  "radon>=6.0.1",
  "ruff>=0.15.15",
  "ty>=0.0.72",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mutmut]
source_paths = [
  "src/genai_literacy_trial/quant_config.py",
  "src/genai_literacy_trial/quant_models.py",
  "src/genai_literacy_trial/quant_pipeline.py",
  "src/genai_literacy_trial/quant_preprocess.py",
  "src/genai_literacy_trial/quant_stats.py",
  "src/genai_literacy_trial/validate_artifacts.py",
]
also_copy = ["config/", "src/genai_literacy_trial/"]
mutate_only_covered_lines = true
# These patterns exclude equivalent mutations only. Runtime-only type casts,
# pandas/NumPy defaults, and hash chunking do not change valid public outputs;
# scientific values, branch predicates, labels, and error text stay mutable.
do_not_mutate_patterns = [
  'nonfinite_assignment.*astype\(float\)',
  'noninteger_assignment.*astype\(float\)',
  'nonfinite_prompt_score.*astype\(float\)',
  'groupby\(group_cols, dropna=False, sort=True\)',
  'groupby\(group_col, sort=True\)',
  'np\.array\(\[len\(g\) for g in groups\], dtype=float\)',
  'if np\.any\(ns < 2\):',
  'path\.read_text\(encoding="utf-8"\)',
  'cast\(dict\[str, object\], recorded_value\)',
  'cast\(dict\[str, object\], value\)',
  'cast\(dict\[str, list\[str\]\], _as_table\(value, section\)\)',
  'cast\(dict\[str, float\], _as_table\(value, section\)\)',
  'cast\(dict\[str, str\], _as_table\(data\.get\("columns", \{\}\), "columns"\)\)',
  'cast\(Sequence\[str\], labels\.get\("groups", default\.groups\)\)',
  'cast\(Sequence\[int\], labels\.get\("assignments", default\.assignments\)\)',
  'cast\(int, privacy\.get\("min_public_cell_count", default\.min_public_cell_count\)\)',
  'cast\(ExpectedInventory, data\)',
  'cast\(TrainingContrastRow,',
  'pd\.Series\(a\)\.dropna\(\)\.astype\(float\)',
  'pd\.Series\(b\)\.dropna\(\)\.astype\(float\)',
  'if len\(x\) == 0 or len\(y\) == 0',
  'out\.get\("prior_chatgpt_use", np\.nan\)',
  'rng\.choice\(x, size=\(n_boot, len\(x\)\), replace=True\)',
  'rng\.choice\(y, size=\(n_boot, len\(y\)\), replace=True\)',
  'pivot_table\(index=PARTICIPANT_KEY_COLUMN, columns="phase", values=dimension, aggfunc="mean"\)',
  'wide\.get\(NORMALIZED_PRE_LABEL, pd\.Series\(dtype=float\)\)',
  'wide\.get\(NORMALIZED_POST_LABEL, pd\.Series\(dtype=float\)\)',
  'else pd\.Series\(dtype=float\)',
  'float\("nan"\)',
  'encode\("utf-8"\)',
  'merge\(.*on=PARTICIPANT_KEY_COLUMN',
  'zip\(group_cols, key_values, strict=True\)',
  'values=config\.columns\.id',
  'fill_value=0',
  'numeric\.astype\(float\)',
  'np\.array\(\[len\(group\) for group in groups\], dtype=float\)',
  'np\.var\(group, ddof=0\)',
  'cast\(dict\[str, object\], payload\)',
  'parser\.add_argument\("--manifest", type=Path, default=None,',
  'TRANSCRIPT_RE\.search\(str\(col\)\)',
  'pre\.groupby\(c\.prior_chatgpt_use, dropna=False, sort=True\)',
  'groupby\(participant_key_col, dropna=False\)',
  'duplicated\(\[PARTICIPANT_KEY_COLUMN, c\.assignment\], keep=False\)',
  'groupby\(PARTICIPANT_KEY_COLUMN, as_index=False\)',
  'values\s*=\s*config\.columns\.id',
  'fill_value\s*=\s*0',
  'assignment\["assignment"\]\.dropna\(\)\.astype\(int\)',
  'cast\(pd\.Series, frame\.groupby\(\["group", "scored_assignments"\], dropna=False\)\.size\(\)\)',
  'frame\.groupby\(\["group", "scored_assignments"\], dropna=False\)',
  'pd\.Series\(values\)\.dropna\(\)\.astype\(float\)',
  'series\.astype\(float\)',
  'p = np\.array\(\[1\.0 if pd\.isna\(v\) else float\(v\) for v in p_values\]\)',
  'x_variance = np\.nanvar\(frame\["x"\], ddof=0\)',
  'y_variance = np\.nanvar\(frame\["y"\], ddof=0\)',
  'item_var = df\.var\(axis=0, ddof=1\)\.sum\(\)',
  'stream\.read\(1024 \* 1024\)',
  'rng\.choice\(arr, size=\(n_boot, len\(arr\)\), replace=True\)',
  'part\[value_col\]\.dropna\(\)\.shape\[0\] > 1',
  'rng\.choice\(a, len\(a\), True\)',
  'rng\.choice\(b, len\(b\), True\)',
  'df\.var\(axis=0, ddof=1\)',
  'zip\(group_cols, keys, strict=True\)',
  'TemporaryDirectory\(prefix=.*backup-.*dir=public_output_dir\.parent.*\)',
]
pytest_add_cli_args_test_selection = [
  "tests/test_high_risk_contracts.py",
  "tests/test_quant_config.py",
  "tests/test_quant_models.py",
  "tests/test_quant_pipeline.py::test_read_primary_input_preserves_dataset_name",
  "tests/test_quant_pipeline.py::test_sample_bad_values_keeps_three_value_error_limit",
  "tests/test_quant_pipeline.py::test_numeric_input_issues_does_not_reject_fractional_noninteger_scores_by_default",
  "tests/test_quant_pipeline.py::test_score_reliability_items_uses_the_five_point_reverse_code",
  "tests/test_quant_preprocess.py",
  "tests/test_quant_stats.py",
  "tests/test_validate_artifacts.py",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
