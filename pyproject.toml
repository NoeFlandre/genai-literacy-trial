[project]
name = "genai-literacy-trial"
version = "0.1.0"
description = "Privacy-preserving reproducibility package for the GenAI literacy prompt-engineering trial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Noe Y. Flandre" },
]
dependencies = [
  "numpy>=1.26",
  "openpyxl>=3.1.5",
  "pandas>=2.2",
  "scipy>=1.12",
  "typer>=0.12",
]

[project.scripts]
genai-literacy-trial = "genai_literacy_trial.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

